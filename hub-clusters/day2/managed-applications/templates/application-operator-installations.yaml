apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-operator-installations
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: {{ include "managed-apps.repoURL" . | quote }}
    targetRevision: {{ include "managed-apps.targetRevision" . | quote }}
    path: hub-clusters/day2/applications/operator-installations
    helm:
      releaseName: operator-installations
      valueFiles:
        - {{ include "managed-apps.hubValuesFromDay2App" . | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: local-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
