apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-tekton-ztp
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: {{ include "managed-apps.repoURL" . | quote }}
    targetRevision: {{ include "managed-apps.targetRevision" . | quote }}
    path: cluster-automation/spoke-automation/ztp-pipeline
    helm:
      releaseName: tekton-ztp-pipeline
      valueFiles:
        - {{ include "managed-apps.hubValuesFromClusterAutomation" . | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-pipelines
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
