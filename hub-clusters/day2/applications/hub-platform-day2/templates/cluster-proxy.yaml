{{- if .Values.hubPlatform.proxy.enabled }}
apiVersion: config.openshift.io/v1
kind: Proxy
metadata:
  name: cluster
spec:
  httpProxy: {{ .Values.hubPlatform.proxy.httpProxy | quote }}
  httpsProxy: {{ .Values.hubPlatform.proxy.httpsProxy | quote }}
  noProxy: {{ .Values.hubPlatform.proxy.noProxy | quote }}
{{- end }}
