{{- /*
Grant the ArgoCD application-controller service account cluster-admin so it can
manage cluster-scoped and cross-namespace resources (ACM, Tekton, CRDs, etc.).
Required for GitOps management of MultiClusterHub, OperatorPolicy, Pipeline,
and other privileged resource types across multiple namespaces.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
