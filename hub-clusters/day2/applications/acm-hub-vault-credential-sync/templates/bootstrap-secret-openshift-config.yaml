{{- if and .Values.vaultHubCredentialSync.enabled .Values.vaultHubCredentialSync.bootstrapSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vaultHubCredentialSync.sourceSecret.name | quote }}
  namespace: {{ .Values.vaultHubCredentialSync.sourceSecret.namespace | quote }}
  labels:
    app.kubernetes.io/name: vault-hub-bootstrap-credentials
    app.kubernetes.io/component: hub-vault-bootstrap
type: Opaque
stringData:
{{- range $k, $v := .Values.vaultHubCredentialSync.bootstrapSecret.stringData }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
