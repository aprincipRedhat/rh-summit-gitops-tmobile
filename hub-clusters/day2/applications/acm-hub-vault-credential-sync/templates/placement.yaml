{{- if .Values.vaultHubCredentialSync.enabled }}
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ .Values.vaultHubCredentialSync.placementName | quote }}
  namespace: {{ .Values.vaultHubCredentialSync.policyNamespace | quote }}
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: local-cluster
              operator: In
              values:
                - "true"
{{- end }}
