{{- if and .Values.vaultSecretsOperator.enabled .Values.vaultBootstrap.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vaultBootstrap.secretName | quote }}
  namespace: {{ .Values.vaultBootstrap.namespace | quote }}
  labels:
    app.kubernetes.io/name: vault-bootstrap-credentials
    app.kubernetes.io/component: hub-vault-bootstrap
type: Opaque
stringData:
{{- range $k, $v := .Values.vaultBootstrap.stringData }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
