# Hub overrides: hub-clusters/day2/99-environments/<env>/<site>/<hub>/values.yaml under tektonNodeReplacement
tektonNodeReplacement:
  enabled: false
  serviceAccount:
    name: pipeline-ztp-gitops
  git:
    cloneDepth: 50
  vault:
    secretName: ""
  github:
    secretName: github-tekton-token
    secretKey: token
  ansible:
    preflightConfigMapName: ztp-ansible-preflight
  waitForMerge:
    pollIntervalSeconds: 30
    timeoutSeconds: 7200
  deployWatch:
    pollIntervalSeconds: 30
    timeoutSeconds: 14400
  etcdManualGate:
    timeoutSeconds: 7200
  images:
    git: docker.io/alpine/git:v2.43.0
    ansible: quay.io/ansible/ansible-runner:latest
    helm: docker.io/alpine/helm:3.14.4
    alpineTools: docker.io/alpine:3.19
    cli: quay.io/openshift/origin-cli:4.15
  pipeline:
    name: ztp-node-replacement
  pipelineRun:
    example:
      enabled: false
      clusterName: dev-east-us-1
      gitopsRepoUrl: https://github.com/example-org/example-gitops.git
      gitRevision: main
      gitBaseBranch: main
      githubRepoSlug: example-org/example-gitops
      manifestOutputDir: spoke-clusters/dev/east/dev-hub-east-1/clusters
