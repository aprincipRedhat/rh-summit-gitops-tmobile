{{- if and .Values.tektonNodeReplacement.enabled .Values.tektonNodeReplacement.pipelineRun.example.enabled }}
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: node-replacement-demo-
  namespace: openshift-pipelines
spec:
  pipelineRef:
    name: {{ .Values.tektonNodeReplacement.pipeline.name }}
  params:
    - name: cluster-name
      value: {{ .Values.tektonNodeReplacement.pipelineRun.example.clusterName | quote }}
    - name: gitops-repo-url
      value: {{ .Values.tektonNodeReplacement.pipelineRun.example.gitopsRepoUrl | quote }}
    - name: git-revision
      value: {{ .Values.tektonNodeReplacement.pipelineRun.example.gitRevision | default "main" | quote }}
    - name: git-base-branch
      value: {{ .Values.tektonNodeReplacement.pipelineRun.example.gitBaseBranch | default "main" | quote }}
    - name: github-repo-slug
      value: {{ .Values.tektonNodeReplacement.pipelineRun.example.githubRepoSlug | quote }}
    - name: manifest-output-dir
      value: {{ .Values.tektonNodeReplacement.pipelineRun.example.manifestOutputDir | quote }}
    - name: execute-destructive
      value: "false"
    - name: skip-wait-merge-suppress
      value: "true"
    - name: skip-wait-merge-final
      value: "true"
    - name: skip-deploy-watch
      value: "true"
    - name: skip-ansible
      value: "true"
  taskRunTemplate:
    serviceAccountName: {{ .Values.tektonNodeReplacement.serviceAccount.name | default "pipeline-ztp-gitops" }}
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
{{- end }}
