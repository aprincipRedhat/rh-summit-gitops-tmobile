# Default values for mirror-pipeline — override from hub 99-environments (tektonMirror) when templating.
tektonMirror:
  pipeline:
    name: ocp-registry-mirror
    mirrorImage: quay.io/openshift/origin-cli:latest
  images:
    alpineTools: docker.io/alpine:3.19
  imagesetConfigMapKey: ImageSetConfiguration.yaml
  serviceAccount:
    name: pipeline-oc-mirror
  rbac:
    configMapName: mirror-imageset-configuration
    secretName: mirror-registry-pullsecret
  github:
    secretName: gitops-github-token
    secretKey: GH_TOKEN
  gitSync:
    skip: "false"
    yqVersion: v4.44.3
    ghVersion: "2.49.0"
    gitopsRepoUrl: https://github.com/example-org/example-gitops.git
    gitRevision: main
    gitBaseBranch: main
    githubRepoSlug: example-org/example-gitops
    hubValuesRelativePath: hub-clusters/day2/99-environments/dev/east/dev-hub-east-1/values.yaml
    policyManifestRelativePath: spoke-clusters/dev/east/dev-hub-east-1/policies/manifests/oc-mirror-idms-itms.yaml
    skipPolicyManifestSync: "false"
    gitUserName: oc-mirror Bot
    gitUserEmail: oc-mirror@local
  exampleConfigMap:
    enabled: false
  pipelineRun:
    example:
      enabled: false
      generateName: ocp-registry-mirror-demo-
      destRegistry: docker://registry.example.com:5000/ocp-mirror
      extraFlags: ""
      skipGitSync: "false"
      sharedStorage: 5Gi
