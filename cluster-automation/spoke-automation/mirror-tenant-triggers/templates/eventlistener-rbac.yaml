{{- if .Values.tenantMirrorTriggers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-el-role" .Values.tenantMirrorTriggers.serviceAccount.name }}
  namespace: openshift-pipelines
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-el-binding" .Values.tenantMirrorTriggers.serviceAccount.name }}
  namespace: openshift-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-el-role" .Values.tenantMirrorTriggers.serviceAccount.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tenantMirrorTriggers.serviceAccount.name }}
    namespace: openshift-pipelines
{{- end }}
