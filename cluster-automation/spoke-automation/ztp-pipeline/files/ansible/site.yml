---
- name: ZTP ansible checks
  hosts: all
  gather_facts: false
  become: false
  vars:
    dns_automation_enabled: false
  pre_tasks:
    - name: Derive nodeHostnames from nodeGroups when set
      ansible.builtin.include_tasks: pre_tasks_node_inventory.yml
      tags: always
      when:
        - nodeGroups is defined
        - (nodeGroups.masters | default([]) | length > 0) or (nodeGroups.workers | default([]) | length > 0)
  roles:
    - role: hardware_preflight
      tags: [hardware, bmc]
    - role: dns_check
      tags: [dns]
    - role: ping_mesh
      tags: [ping]
    - role: redfish_mac_discovery
      tags: [mac-discovery, redfish, hardware]
