apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-binding" (dig "tektonZtp" "serviceAccount" "name" "pipeline-ztp-gitops" (fromJson (toJson .Values))) }}
  namespace: openshift-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-role" (dig "tektonZtp" "serviceAccount" "name" "pipeline-ztp-gitops" (fromJson (toJson .Values))) }}
subjects:
  - kind: ServiceAccount
    name: {{ dig "tektonZtp" "serviceAccount" "name" "pipeline-ztp-gitops" (fromJson (toJson .Values)) }}
    namespace: openshift-pipelines
