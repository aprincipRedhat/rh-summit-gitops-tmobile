apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-role" .Values.tektonZtp.serviceAccount.name }}
  namespace: openshift-pipelines
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.tektonZtp.github.secretName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.tektonZtp.ansible.preflightConfigMapName | quote }}]
    verbs: ["get"]
  # Manual approval gate creates/patches ConfigMaps named ztp-manual-<cluster>-approval in openshift-pipelines
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
