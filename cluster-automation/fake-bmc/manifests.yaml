---
apiVersion: v1
kind: Namespace
metadata:
  name: ztp-testing
  labels:
    app.kubernetes.io/name: ztp-testing
    app.kubernetes.io/component: fake-bmc
---
# Server script baked into a ConfigMap — no custom image build required.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-bmc-script
  namespace: ztp-testing
  labels:
    app.kubernetes.io/name: fake-bmc
data:
  server.py: |
    #!/usr/bin/env python3
    """
    Combined fake BMC + fake Vault KV v2 server for ZTP pipeline testing.
    Port 8000: Redfish API  (Basic auth: BMC_USERNAME / BMC_PASSWORD)
    Port 8001: Vault KV v2  (any X-Vault-Token accepted; returns BMC_USERNAME/BMC_PASSWORD for any path)
    """
    import base64, json, os, sys, http.server, threading

    USERNAME           = os.environ.get("BMC_USERNAME",    "admin")
    PASSWORD           = os.environ.get("BMC_PASSWORD",    "Fakebmc@123")
    IFACE_MAC_EMBEDDED = os.environ.get("BMC_MAC_EMBEDDED", "AA:BB:CC:11:22:33")
    IFACE_MAC_NIC2     = os.environ.get("BMC_MAC_NIC2",     "AA:BB:CC:44:55:66")

    # --- Redfish responses ---
    REDFISH = {
        "/redfish/v1": {"@odata.id":"/redfish/v1","Systems":{"@odata.id":"/redfish/v1/Systems"}},
        "/redfish/v1/Systems": {"@odata.id":"/redfish/v1/Systems","Members":[{"@odata.id":"/redfish/v1/Systems/1"}],"Members@odata.count":1},
        "/redfish/v1/Systems/1": {"@odata.id":"/redfish/v1/Systems/1","EthernetInterfaces":{"@odata.id":"/redfish/v1/Systems/1/EthernetInterfaces"}},
        "/redfish/v1/Systems/1/EthernetInterfaces": {"@odata.id":"/redfish/v1/Systems/1/EthernetInterfaces","Members":[{"@odata.id":"/redfish/v1/Systems/1/EthernetInterfaces/Embedded.1"},{"@odata.id":"/redfish/v1/Systems/1/EthernetInterfaces/NIC.2"}],"Members@odata.count":2},
        "/redfish/v1/Systems/1/EthernetInterfaces/Embedded.1": {"@odata.id":"/redfish/v1/Systems/1/EthernetInterfaces/Embedded.1","Name":"Embedded NIC 1","MACAddress":IFACE_MAC_EMBEDDED,"PermanentMACAddress":IFACE_MAC_EMBEDDED,"LinkStatus":"Up"},
        "/redfish/v1/Systems/1/EthernetInterfaces/NIC.2": {"@odata.id":"/redfish/v1/Systems/1/EthernetInterfaces/NIC.2","Name":"NIC Slot 2","MACAddress":IFACE_MAC_NIC2,"PermanentMACAddress":IFACE_MAC_NIC2,"LinkStatus":"Down"},
    }

    def _json_response(handler, status, body):
        b = json.dumps(body).encode()
        handler.send_response(status); handler.send_header("Content-Type","application/json"); handler.send_header("Content-Length",str(len(b))); handler.end_headers(); handler.wfile.write(b)

    class RedfishHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, fmt, *args): sys.stderr.write(f"[redfish] {self.address_string()} {fmt%args}\n"); sys.stderr.flush()
        def _auth(self):
            h=self.headers.get("Authorization","")
            if not h.startswith("Basic "): return False
            try:
                u,_,p=base64.b64decode(h[6:]).decode().partition(":")
                return u==USERNAME and p==PASSWORD
            except: return False
        def do_GET(self):
            path=self.path.split("?")[0].rstrip("/") or "/redfish/v1"
            if not self._auth(): self.send_response(401); self.send_header("WWW-Authenticate",'Basic realm="Fake"'); self.end_headers(); return
            d=REDFISH.get(path)
            _json_response(self,200,d) if d else _json_response(self,404,{"error":f"{path} not found"})

    class VaultHandler(http.server.BaseHTTPRequestHandler):
        """Returns fake BMC creds for ANY KV v2 path — accepts any token."""
        def log_message(self, fmt, *args): sys.stderr.write(f"[vault]   {self.address_string()} {fmt%args}\n"); sys.stderr.flush()
        def do_GET(self):
            token=self.headers.get("X-Vault-Token","")
            if not token: _json_response(self,403,{"errors":["missing token"]}); return
            _json_response(self,200,{"data":{"data":{"username":USERNAME,"password":PASSWORD}}})

    import subprocess, ssl, tempfile

    def _gen_cert():
        d=tempfile.mkdtemp()
        k=d+"/key.pem"; c=d+"/cert.pem"
        subprocess.run(["openssl","req","-x509","-nodes","-newkey","rsa:2048","-keyout",k,"-out",c,"-subj","/CN=fake-bmc","-days","3650"],check=True,capture_output=True)
        ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        ctx.load_cert_chain(c,k)
        ctx.check_hostname=False
        return ctx

    _tls=_gen_cert()
    sys.stderr.write("[fake-bmc] TLS self-signed cert generated\n"); sys.stderr.flush()

    def _serve(HandlerClass, port, tls=None):
        s=http.server.HTTPServer(("0.0.0.0",port),HandlerClass)
        if tls: s.socket=tls.wrap_socket(s.socket,server_side=True)
        sys.stderr.write(f"[fake-bmc] {HandlerClass.__name__} on :{port} {'(TLS)' if tls else '(plain)'}\n"); sys.stderr.flush()
        s.serve_forever()

    threading.Thread(target=_serve,args=(VaultHandler,8001),daemon=True).start()
    _serve(RedfishHandler,8000,tls=_tls)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-bmc
  namespace: ztp-testing
  labels:
    app.kubernetes.io/name: fake-bmc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-bmc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-bmc
    spec:
      containers:
        - name: fake-bmc
          image: registry.redhat.io/openshift4/ose-tools-rhel9:v4.20
          command: ["python3", "/scripts/server.py", "8000"]
          ports:
            - containerPort: 8000
              name: redfish
          env:
            - name: BMC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fake-bmc-creds
                  key: username
            - name: BMC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fake-bmc-creds
                  key: password
            - name: BMC_MAC_EMBEDDED
              value: "AA:BB:CC:11:22:33"
            - name: BMC_MAC_NIC2
              value: "AA:BB:CC:44:55:66"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: script
          configMap:
            name: fake-bmc-script
            defaultMode: 0755
---
# Credentials for the fake BMC — also seeded into Vault by seed-vault.sh
apiVersion: v1
kind: Secret
metadata:
  name: fake-bmc-creds
  namespace: ztp-testing
  labels:
    app.kubernetes.io/name: fake-bmc
stringData:
  username: admin
  password: Fakebmc@123
---
apiVersion: v1
kind: Service
metadata:
  name: fake-bmc
  namespace: ztp-testing
  labels:
    app.kubernetes.io/name: fake-bmc
spec:
  selector:
    app.kubernetes.io/name: fake-bmc
  ports:
    - name: redfish
      port: 8000
      targetPort: 8000
    - name: vault
      port: 8001
      targetPort: 8001
---
# Injected into the Ansible pod via tektonZtp.vault.secretName so the
# MAC discovery role calls the fake Vault server instead of a real one.
apiVersion: v1
kind: Secret
metadata:
  name: fake-vault-creds
  namespace: openshift-pipelines
  labels:
    app.kubernetes.io/name: fake-bmc
    app.kubernetes.io/component: vault-mock
stringData:
  VAULT_ADDR: "http://fake-bmc.ztp-testing.svc.cluster.local:8001"
  VAULT_TOKEN: "fake-token"
