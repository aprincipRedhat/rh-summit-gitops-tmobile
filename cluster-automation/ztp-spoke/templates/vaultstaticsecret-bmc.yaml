{{- if and .Values.vault.enabled (gt (len .Values.nodeHostnames) 0) }}
{{- range $h := .Values.nodeHostnames }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ printf "%s-bmc-sync-%s" $.Values.cluster.name $h | quote }}
  namespace: {{ $.Values.cluster.namespace | quote }}
spec:
  vaultAuthRef: {{ $.Values.vault.vaultAuthRef | quote }}
  mount: {{ $.Values.vault.mount | quote }}
  path: {{ $.Values.vault.bmcCredentialsVaultPathPattern | replace "%s" $h | replace "{hostname}" $h | quote }}
  type: kv-v2
  destination:
    name: {{ include "ztp-spoke.bmcDestinationSecretName" (dict "clusterName" $.Values.cluster.name "hostname" $h) | quote }}
    create: true
{{- end }}
{{- end }}
