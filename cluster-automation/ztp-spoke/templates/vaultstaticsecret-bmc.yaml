{{- $bmcHosts := .Values.nodeHostnames | default list }}
{{- if eq (len $bmcHosts) 0 }}
{{- $fromNodes := list }}
{{- range $n := (.Values.nodes | default list) }}
{{- if kindIs "map" $n }}
{{- $h := coalesce (index $n "hostName") (index $n "hostname") }}
{{- if $h }}
{{- $fromNodes = append $fromNodes $h }}
{{- end }}
{{- end }}
{{- end }}
{{- $bmcHosts = compact $fromNodes }}
{{- end }}
{{- if and .Values.vault.enabled (gt (len $bmcHosts) 0) }}
{{- range $h := $bmcHosts }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ printf "%s-bmc-sync-%s" $.Values.cluster.name $h | quote }}
  namespace: {{ $.Values.cluster.namespace | quote }}
spec:
  vaultAuthRef: {{ $.Values.vault.vaultAuthRef | quote }}
  mount: {{ $.Values.vault.mount | quote }}
  path: {{ $.Values.vault.bmcCredentialsVaultPathPattern | replace "%s" $h | replace "{hostname}" $h | quote }}
  type: kv-v2
  destination:
    name: {{ include "ztp-spoke.bmcDestinationSecretName" (dict "clusterName" $.Values.cluster.name "hostname" $h) | quote }}
    create: true
{{- end }}
{{- end }}
