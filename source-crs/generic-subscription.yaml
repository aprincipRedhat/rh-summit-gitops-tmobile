# Generic OLM Subscription — substitute ${NAME}, ${PACKAGE_NAME}, ${CHANNEL}; patch namespace/source if needed.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ${NAME}
  namespace: openshift-operators
spec:
  channel: ${CHANNEL}
  name: ${PACKAGE_NAME}
  source: redhat-operators
  sourceNamespace: openshift-marketplace
