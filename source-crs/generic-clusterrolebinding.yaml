# Generic ClusterRoleBinding — substitute ${NAME}, ${CLUSTER_ROLE_NAME}, ${SERVICE_ACCOUNT_NAME}, ${NAMESPACE}.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${CLUSTER_ROLE_NAME}
subjects:
  - kind: ServiceAccount
    name: ${SERVICE_ACCOUNT_NAME}
    namespace: ${NAMESPACE}
