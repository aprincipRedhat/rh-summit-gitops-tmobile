# Child Applications picked up by the bootstrap root Application (app-of-apps).
# Each resource is an OpenShift GitOps Application: same openshift-gitops namespace, AppProject default,
# in-cluster server; only source path and target workload namespace differ per app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application-ocp-operators-policy.yaml
  - application-tekton-mirror.yaml
  - application-tekton-bulk-ztp.yaml
  - application-tekton-ztp.yaml
  - application-acm-policies.yaml
