---
- name: Redfish prelim — no BMC address in inventory
  ansible.builtin.debug:
    msg: >-
      Set bmc_address (and optionally bmc_username / bmc_password from vault) for Redfish checks.
  when: bmc_address is not defined

- name: Redfish prelim — GET service root (may return 401 without credentials)
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/"
    method: GET
    validate_certs: false
    timeout: 15
    status_code: [200, 401, 403]
  register: redfish_root
  ignore_errors: true
  when: bmc_address is defined

- name: Redfish prelim — report HTTP status
  ansible.builtin.debug:
    var: redfish_root.status
  when: bmc_address is defined and redfish_root is defined
