apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ .Values.tektonZtp.pipeline.name }}
  namespace: openshift-pipelines
spec:
  description: >-
    Clone GitOps repo, run Ansible preflight from chart-bundled ConfigMap, resolve **/pipeline-values/<cluster-name>.yaml in the repo,
    helm template ztp-spoke with that file, push branch, open GitHub PR.
  params:
    - name: cluster-name
      type: string
    - name: gitops-repo-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: git-base-branch
      type: string
      default: main
    - name: github-repo-slug
      type: string
      description: owner/repo for gh CLI (e.g. aprincipRedhat/rh-summit-gitops-tmobile)
    - name: ztp-chart-relative-path
      type: string
      default: spokes/cluster-automation/helm/ztp-spoke
    - name: manifest-output-dir
      type: string
      default: spokes/clusters
    - name: skip-ansible
      type: string
      default: "false"
    - name: ansible-tags
      type: string
      default: dns,ping
    - name: git-user-name
      type: string
      default: "ZTP OCP Pipelines"
    - name: git-user-email
      type: string
      default: "ztp-tekton@local"
    - name: pr-title-prefix
      type: string
      default: "Add cluster"
    - name: pr-title-prefix-modify
      type: string
      default: "Update cluster"
  workspaces:
    - name: shared
      description: PVC holding cloned repo and rendered manifests
  tasks:
    - name: clone-gitops
      workspaces:
        - name: shared
          workspace: shared
      params:
        - name: gitops-repo-url
          value: $(params.gitops-repo-url)
        - name: git-revision
          value: $(params.git-revision)
      taskSpec:
        workspaces:
          - name: shared
        params:
          - name: gitops-repo-url
          - name: git-revision
        steps:
          - name: clone
            image: {{ .Values.tektonZtp.images.git | quote }}
            script: |
              #!/bin/sh
              set -eu
              cd "$(workspaces.shared.path)"
              rm -rf src
              git clone --depth 1 --branch "$(params.git-revision)" "$(params.gitops-repo-url)" src

    - name: ansible-preflight
      runAfter: [clone-gitops]
      workspaces:
        - name: shared
          workspace: shared
      params:
        - name: skip-ansible
          value: $(params.skip-ansible)
        - name: ansible-tags
          value: $(params.ansible-tags)
      taskSpec:
        volumes:
          - name: ansible-preflight-bundle
            configMap:
              name: {{ .Values.tektonZtp.ansible.preflightConfigMapName | quote }}
        workspaces:
          - name: shared
        params:
          - name: skip-ansible
          - name: ansible-tags
        steps:
          - name: run-ansible
            image: {{ .Values.tektonZtp.images.ansible | quote }}
            volumeMounts:
              - name: ansible-preflight-bundle
                mountPath: /ansible-cm
                readOnly: true
            script: |
              #!/bin/bash
              set -euo pipefail
              if [[ "$(params.skip-ansible)" == "true" ]]; then
                echo "skip-ansible=true — skipping Ansible preflight"
                exit 0
              fi
              RESTORE=/tmp/ansible-preflight
              rm -rf "$RESTORE"
              mkdir -p "$RESTORE"
              shopt -s nullglob
              for keypath in /ansible-cm/*; do
                base=$(basename "$keypath")
                rel=${base//__//}
                mkdir -p "$RESTORE/$(dirname "$rel")"
                cp "$keypath" "$RESTORE/$rel"
              done
              REQ="$RESTORE/requirements.yml"
              SITE="$RESTORE/preflight/site.yml"
              if [[ ! -f "$SITE" ]]; then
                echo "Bundled Ansible preflight missing at $SITE (ConfigMap mount)" >&2
                exit 1
              fi
              ansible-galaxy collection install -r "$REQ" -p /tmp/collections || true
              export ANSIBLE_COLLECTIONS_PATH=/tmp/collections
              ansible-playbook -i "localhost," -c local "$SITE" \
                --tags "$(params.ansible-tags)" \
                -e ansible_python_interpreter=/usr/bin/python3

    - name: helm-template
      runAfter: [ansible-preflight]
      workspaces:
        - name: shared
          workspace: shared
      params:
        - name: cluster-name
          value: $(params.cluster-name)
        - name: ztp-chart-relative-path
          value: $(params.ztp-chart-relative-path)
        - name: manifest-output-dir
          value: $(params.manifest-output-dir)
      taskSpec:
        workspaces:
          - name: shared
        params:
          - name: cluster-name
          - name: ztp-chart-relative-path
          - name: manifest-output-dir
        steps:
          - name: helm
            image: {{ .Values.tektonZtp.images.helm | quote }}
            script: |
              #!/bin/sh
              set -eu
              cd "$(workspaces.shared.path)/src"
              CLUSTER="$(params.cluster-name)"
              TMP=/tmp/pipeline-values-matches.$$
              trap 'rm -f "$TMP"' EXIT INT HUP
              find . -path './.git' -prune -o -type f -path "*/pipeline-values/${CLUSTER}.yaml" -print \
                | sort > "$TMP"
              count=$(wc -l < "$TMP" | tr -cd '0123456789')
              if [ "$count" -eq 0 ]; then
                echo "No pipeline values file for cluster ${CLUSTER} (expected **/pipeline-values/${CLUSTER}.yaml)" >&2
                exit 1
              fi
              if [ "$count" -gt 1 ]; then
                echo "Multiple pipeline values files for ${CLUSTER}:" >&2
                cat "$TMP" >&2
                exit 1
              fi
              VALUES_REL=$(head -n 1 "$TMP")
              VALUES="$(pwd)/${VALUES_REL#./}"
              if [ ! -f "$VALUES" ]; then
                echo "Values file not found: $VALUES" >&2
                exit 1
              fi
              OUT="$(params.manifest-output-dir)/$(params.cluster-name)"
              mkdir -p "$OUT"
              helm template "$(params.cluster-name)" "./$(params.ztp-chart-relative-path)" -f "$VALUES" \
                > "${OUT}/manifests.yaml"

    - name: git-push-pr
      runAfter: [helm-template]
      workspaces:
        - name: shared
          workspace: shared
      params:
        - name: cluster-name
          value: $(params.cluster-name)
        - name: manifest-output-dir
          value: $(params.manifest-output-dir)
        - name: gitops-repo-url
          value: $(params.gitops-repo-url)
        - name: git-base-branch
          value: $(params.git-base-branch)
        - name: github-repo-slug
          value: $(params.github-repo-slug)
        - name: git-user-name
          value: $(params.git-user-name)
        - name: git-user-email
          value: $(params.git-user-email)
        - name: pr-title-prefix
          value: $(params.pr-title-prefix)
        - name: pr-title-prefix-modify
          value: $(params.pr-title-prefix-modify)
      taskSpec:
        workspaces:
          - name: shared
        params:
          - name: cluster-name
          - name: manifest-output-dir
          - name: gitops-repo-url
          - name: git-base-branch
          - name: github-repo-slug
          - name: git-user-name
          - name: git-user-email
          - name: pr-title-prefix
          - name: pr-title-prefix-modify
        steps:
          - name: push-and-pr
            image: {{ .Values.tektonZtp.images.alpineTools | quote }}
            env:
              - name: GH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: {{ .Values.tektonZtp.github.secretName }}
                    key: {{ .Values.tektonZtp.github.secretKey }}
            script: |
              #!/bin/sh
              set -eu
              apk add --no-cache git github-cli bash
              cd "$(workspaces.shared.path)/src"
              git config user.name "$(params.git-user-name)"
              git config user.email "$(params.git-user-email)"
              CLUSTER_PATH="$(params.manifest-output-dir)/$(params.cluster-name)/manifests.yaml"
              if git cat-file -e "HEAD:${CLUSTER_PATH}" 2>/dev/null; then
                CHANGE_TYPE="modify"
                BRANCH="update-cluster-$(params.cluster-name)-$(date +%s)"
                COMMIT_MSG="ZTP: update cluster $(params.cluster-name)"
                TITLE="$(params.pr-title-prefix-modify) $(params.cluster-name)"
              else
                CHANGE_TYPE="create"
                BRANCH="add-cluster-$(params.cluster-name)-$(date +%s)"
                COMMIT_MSG="ZTP: add cluster $(params.cluster-name)"
                TITLE="$(params.pr-title-prefix) $(params.cluster-name)"
              fi
              git checkout -b "$BRANCH"
              git add "$(params.manifest-output-dir)/$(params.cluster-name)"
              git commit -m "$COMMIT_MSG" || (git status; exit 1)
              REMOTE="$(params.gitops-repo-url)"
              case "$REMOTE" in
                https://github.com/*)
                  OWNER_REPO=$(echo "$REMOTE" | sed -e 's|https://github.com/||' -e 's|\.git$||')
                  git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${OWNER_REPO}.git"
                  ;;
                *)
                  echo "Expected https://github.com/... clone URL for token-based push" >&2
                  exit 1
                  ;;
              esac
              git push -u origin "$BRANCH"
              export GH_TOKEN
              BODY_FILE="$(mktemp)"
              {
                echo "Change-type: ${CHANGE_TYPE}"
                echo ""
                echo "Rendered from spokes/cluster-automation/helm/ztp-spoke via OpenShift Pipelines."
                echo "Cluster path: $(params.manifest-output-dir)/$(params.cluster-name)/"
              } > "$BODY_FILE"
              gh pr create \
                --repo "$(params.github-repo-slug)" \
                --base "$(params.git-base-branch)" \
                --head "$BRANCH" \
                --title "$TITLE" \
                --body-file "$BODY_FILE"
              rm -f "$BODY_FILE"
