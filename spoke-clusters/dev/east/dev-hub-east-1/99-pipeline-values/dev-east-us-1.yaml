# Optional: set baseDomain (or base_domain) so Ansible dns_check can resolve api.<cluster.name>.<domain>
# baseDomain: example.com

ztpCommon:
  enabled: true
  namespace: ztp-common

operators:
  openshift-gitops-operator:
    channel: latest
    startingCSV: openshift-gitops-operator.v1.15.0
    upgradeApproval: Manual
    approvedCSVs:
      - openshift-gitops-operator.v1.15.0
  kubernetes-nmstate-operator:
    channel: stable
    startingCSV: kubernetes-nmstate-operator.v4.17.0
    upgradeApproval: Manual
    approvedCSVs:
      - kubernetes-nmstate-operator.v4.17.0
  openshift-pipelines-operator:
    channel: latest
    startingCSV: openshift-pipelines-operator-rh.v1.19.0
    upgradeApproval: Manual
    approvedCSVs:
      - openshift-pipelines-operator-rh.v1.19.0

clusterValues:
  data:
    etcdBackupSchedule: "0 */12 * * *"

cluster:
  name: dev-east-us-1
  namespace: dev-east-us-1

pullSecretRef:
  name: pull-secret

bmcSecretRef:
  name: bmc-dev-east-us-1

templateRefs:
  - name: example-sno-template
    namespace: openshift-siteconfig

nodes:
  - hostname: master-0
    role: master
    nodeNetwork:
      interfaces:
        - name: eno1
          macAddress: "aa:bb:cc:dd:ee:01"
    rootDeviceHints:
      deviceName: /dev/disk/by-id/scsi-0000
    bmcAddress: redfish-virtualmedia://192.168.20.11/redfish/v1/Systems/1
    bmcCredentialsName:
      name: bmc-dev-east-us-1

extraManifestsRefs: []

extraLabels:
  ManagedCluster:
    common: "true"
    ztp-demo: "true"

extraAnnotations: {}
