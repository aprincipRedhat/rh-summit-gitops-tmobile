# Test overrides for fake-bmc MAC discovery testing.
# Deep-merged on top of dev-east-us-1.yaml by the pipeline's merge-pipeline-values step.
#
# Deploy cluster-automation/fake-bmc/manifests.yaml and run seed-vault.sh first.
# Then trigger cluster-automation/fake-bmc/test-pipelinerun.yaml.

# Point at the in-cluster fake Redfish server (no TLS, no real hardware needed).
# The Ansible role strips scheme/path to build the EthernetInterfaces URL:
#   https://fake-bmc.ztp-testing.svc.cluster.local:8000/redfish/v1/Systems/1/EthernetInterfaces
bmcAddressTemplate: "redfish-virtualmedia://fake-bmc.ztp-testing.svc.cluster.local:8000/redfish/v1/Systems/1"

# vault.secretName injects VAULT_ADDR + VAULT_TOKEN into the Ansible pod
# from the fake-vault-creds Secret (deployed by manifests.yaml).
# The fake Vault server on :8001 accepts any token and returns the BMC creds.
tektonZtp:
  vault:
    secretName: fake-vault-creds

vault:
  # vault-root/data/dev/east/dev-hub-east-1/bmc/master-0 → returned by fake Vault mock
  bmcCredentialsVaultPathPattern: "vault-root/data/dev/east/dev-hub-east-1/bmc/%s"
