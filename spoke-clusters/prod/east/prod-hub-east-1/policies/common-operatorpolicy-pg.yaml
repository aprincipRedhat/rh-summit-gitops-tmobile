apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: summit-common-operatorpolicy
policyDefaults:
  namespace: policies
  remediationAction: inform
  severity: medium
  consolidateManifests: false
  hubTemplateOptions:
    serviceAccountName: policy-hub-template-lookup
  placement:
    labelSelector:
      matchLabels:
        common: "true"
policies:
  - name: policy-olm-gitops-and-nmstate
    disabled: false
    remediationAction: enforce
    severity: high
    manifests:
      - path: ../../../../../source-crs/generic-operatorpolicy.yaml
        patches:
          - apiVersion: policy.open-cluster-management.io/v1beta1
            kind: OperatorPolicy
            metadata:
              name: policy-openshift-gitops-operator
              namespace: '{{ fromClusterClaim "name" }}'
            spec:
              subscription:
                name: openshift-gitops-operator
                namespace: openshift-operators
                channel: stable
                source: redhat-operators
                sourceNamespace: openshift-marketplace
      - path: ../../../../../source-crs/generic-operatorpolicy.yaml
        patches:
          - apiVersion: policy.open-cluster-management.io/v1beta1
            kind: OperatorPolicy
            metadata:
              name: policy-kubernetes-nmstate-operator
              namespace: '{{ fromClusterClaim "name" }}'
            spec:
              subscription:
                name: kubernetes-nmstate-operator
                namespace: openshift-operators
                channel: stable
                source: redhat-operators
                sourceNamespace: openshift-marketplace
