ztpCommon:
  enabled: true
  namespace: ztp-common

clusterValues:
  data:
    etcdBackupSchedule: "0 */12 * * *"
    operatorSubscriptionChannel: latest
    operatorStartingCSV: openshift-pipelines-operator-rh.v1.19.0
    operatorInstallPlanApproval: Manual
    operatorApprovedCsvs: |
      - openshift-pipelines-operator-rh.v1.19.0

cluster:
  name: dev-east-us-1
  namespace: dev-east-us-1

pullSecretRef:
  name: pull-secret

bmcSecretRef:
  name: bmc-dev-east-us-1

templateRefs:
  - name: example-sno-template
    namespace: openshift-siteconfig

nodes:
  - hostname: master-0
    role: master
    nodeNetwork:
      interfaces:
        - name: eno1
          macAddress: "aa:bb:cc:dd:ee:01"
    rootDeviceHints:
      deviceName: /dev/disk/by-id/scsi-0000
    bmcAddress: redfish-virtualmedia://192.168.20.11/redfish/v1/Systems/1
    bmcCredentialsName:
      name: bmc-dev-east-us-1

extraManifestsRefs: []

extraLabels:
  ManagedCluster:
    common: "true"
    ztp-demo: "true"

extraAnnotations: {}
